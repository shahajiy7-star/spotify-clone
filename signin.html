<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Sign Up</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* Animated background glow */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, #1db95433, transparent 60%);
  animation: moveGlow 8s linear infinite;
}

@keyframes moveGlow {
  0% { transform: translate(-20%, -20%); }
  50% { transform: translate(20%, 20%); }
  100% { transform: translate(-20%, -20%); }
}

/* Container */
.container {
  position: relative;
  width: 360px;
  text-align: center;
  z-index: 1;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Logo */
.logo {
  font-size: 30px;
  margin-bottom: 15px;
}

/* Title */
h1 {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 30px;
}

/* Input */
.input-group {
  text-align: left;
  margin-bottom: 20px;
}

.input-group label {
  font-size: 14px;
  display: block;
  margin-bottom: 5px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #121212;
  color: white;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #1db954;
  box-shadow: 0 0 8px #1db954;
}

/* Buttons */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 30px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.3s;
}

.primary {
  background: #1db954;
  color: #000;
}

.primary:hover {
  transform: scale(1.05);
  background: #1ed760;
}

.outline {
  background: transparent;
  border: 1px solid #555;
  color: #fff;
}

.outline:hover {
  border-color: #fff;
  transform: scale(1.05);
}

/* Divider */
.divider {
  margin: 20px 0;
  color: #aaa;
}

/* Footer */
.footer {
  margin-top: 25px;
  font-size: 14px;
}

.footer a {
  color: white;
  font-weight: bold;
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

/* Small text */
.small {
  margin-top: 20px;
  font-size: 11px;
  color: #888;
}

/* Floating animation circles */
.circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.2;
  animation: float 6s infinite ease-in-out;
}

.circle:nth-child(1) {
  width: 100px;
  height: 100px;
  background: #1db954;
  top: -40px;
  left: -40px;
}

.circle:nth-child(2) {
  width: 80px;
  height: 80px;
  background: #ff00cc;
  bottom: -30px;
  right: -30px;
  animation-delay: 2s;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
</style>
</head>

<body>

<div class="container">

  <!-- animated circles -->
  <div class="circle"></div>
  <div class="circle"></div>

  <div class="logo">🎵</div>

  <h1>Sign up to<br>start listening</h1>

  <div class="input-group">
    <label>Email address</label>
    <input type="email" id="email" placeholder="name@domain.com">
  </div>

  <button class="btn primary" onclick="nextStep()">Next</button>

  <div class="divider">or</div>

  <button class="btn outline">📱 Sign up with phone number</button>
  <button class="btn outline">🟢 Sign up with Google</button>
  <button class="btn outline">🍎 Sign up with Apple</button>

  <div class="footer">
    Already have an account?<br>
    <a href="#">Log in</a>
  </div>

  <div class="small">
    This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
  </div>

</div>

<script>
function nextStep() {
  let email = document.getElementById("email").value;

  if(email === "") {
    alert("Please enter your email");
  } else if(!email.includes("@")) {
    alert("Enter a valid email");
  } else {
    alert("Proceeding with: " + email);
  }
}
</script>

</body>
</html>
